[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whoserves"
version = "0.0.1"
description = "Who serves whom: measure anycast catchments from the outside (RIPE Atlas, IPv4 and IPv6). Early placeholder, tooling in development."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Stefan Böck" }]
keywords = ["anycast", "catchment", "dns", "bgp", "ripe atlas", "nsid", "measurement"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: Name Service (DNS)",
  "Topic :: System :: Networking :: Monitoring",
]

[project.urls]
Homepage = "https://anycast.org"
Repository = "https://github.com/anycast-lab/whoserves"
Notes = "https://anycast.dev/notes"

[project.scripts]
whoserves = "whoserves:main"

[tool.setuptools.packages.find]
where = ["src"]
